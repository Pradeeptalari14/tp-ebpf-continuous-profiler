apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-continuous-profiler
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ebpf-profiler
spec:
  selector:
    matchLabels:
      app: ebpf-profiler
  template:
    metadata:
      labels:
        app: ebpf-profiler
    spec:
      hostPID: true
      hostNetwork: true
      containers:
        - name: profiler-agent
          image: ghcr.io/pradeeptalari14/ebpf-profiler:latest
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_PTRACE
                - SYS_ADMIN
                - BPF
                - PERFMON
          volumeMounts:
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: bpf
              mountPath: /sys/fs/bpf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
